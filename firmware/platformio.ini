; =======================================================================
; SMARTMED PILL DISPENSER — PLATFORMIO CONFIGURATION
; Chip: ESP32-S3-WROOM-1 N16R8 (16MB Flash Octal, 8MB PSRAM Octal)
; Framework: Arduino Framework + FreeRTOS
; =======================================================================

[platformio]
default_envs = esp32-s3-n16r8
data_dir = data

[env:esp32-s3-n16r8]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; 1. Cấu hình MCU và xung nhịp tối đa 240MHz
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; 2. Cấu hình Bộ nhớ Flash 16MB & Octal SPI (OPI)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; 3. Bảng phân vùng tùy chỉnh 16MB & LittleFS
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs

; 4. Tốc độ nạp và Cổng Serial Monitor cố định COM14
upload_port = COM14
monitor_port = COM14
monitor_speed = 115200
upload_speed = 921600

; 5. Compiler Build Flags quan trọng
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0      ; Định tuyến Serial ra UART0 phần cứng (CH343 / COM14)
    -DCORE_DEBUG_LEVEL=3
    -DMQTT_MAX_PACKET_SIZE=4096      ; Kích thước gói tin MQTT tối đa 4KB
    -I include
    -DUSE_FSPI_PORT=1                ; Tránh xung đột SPI trên ESP32-S3
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=8
    -DTFT_DC=9
    -DTFT_RST=10
    -DTFT_MISO=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DTFT_INVERSION_OFF=1            ; Tắt đảo màu LCD ST7789 (khắc phục lỗi nền bị trắng, màu bị đảo)
    -DTFT_RGB_ORDER=0                ; Chuẩn BGR cho ST7789 (đảm bảo đỏ ra đỏ, vàng ra vàng)

; 6. Thư viện phụ thuộc tự động tải
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    earlephilhower/ESP8266Audio @ ^1.9.7
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
